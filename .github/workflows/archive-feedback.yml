name: Feedback archivieren
# Läuft alle 6h automatisch (ntfy löscht Nachrichten nach ~12h!)
# plus manuell über Actions-Tab -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-feedback

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/archive-feedback.mjs
      - name: Commit bei Änderungen
        run: |
          if ! git diff --quiet feedback/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feedback/data.json
            git commit -m "Feedback-Archiv aktualisieren"
            git push
            # Bot-Pushes triggern kein on:push -> Pages-Deploy explizit starten
            gh workflow run deploy.yml --ref main
          else
            echo "Keine neuen Einträge."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
